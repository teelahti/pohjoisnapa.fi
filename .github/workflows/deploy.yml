# Deploy each push to firebase hosting. Requires the following secrets:
#
#   FIREBASE_TOKEN        the result of `firebase login:ci` command
#
name: Deploy each push

on:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Build with Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: yarn install
      - run: yarn run build
      - name: Archive built site
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
      - name: Download Artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Deploy to Firebase
        uses: w9jds/firebase-action@v15.37.0
        with:
          args: deploy --only hosting
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
